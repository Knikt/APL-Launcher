<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home tile — logo preview</title>
<link rel="stylesheet" href="css/launcher.css">
<style>
    html, body { margin: 0; height: 100%; background: #0a0b0e; color: #fff;
                 font: 500 22px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
    #stage { width: 1920px; height: 1080px; transform-origin: 0 0; }
    h1 { margin: 70px 0 0 72px; font-size: 40px; font-weight: 700; letter-spacing: -0.5px; }
    p  { margin: 10px 0 0 72px; color: rgba(255,255,255,0.62); font-size: 24px; }
    .row { display: flex; gap: 26px; align-items: flex-start; margin: 54px 0 0 72px; }
    .item { width: 252px; }
    .card { position: relative; width: 252px; height: 158px; border-radius: 30px; overflow: hidden;
            background: #101116; box-shadow: 0 14px 34px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08); }
    .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cap { margin-top: 14px; font-size: 20px; color: rgba(255,255,255,0.72); }
    .cap b { display: block; color: #fff; font-size: 22px; margin-bottom: 2px; }
    .big .card { width: 504px; height: 316px; border-radius: 44px; }
    .big { width: 504px; }
</style>
</head>
<body>
<div id="stage">
    <h1>The Home tile, old mark and new</h1>
    <p>The tile keeps its white plate; only the logo changes. Drawn at the dock's own size (252&nbsp;&times;&nbsp;158).</p>

    <div class="row">
        <div class="item">
            <div class="card"><img src="images/apps/homekit-tile.png" alt="old HomeKit tile"></div>
            <div class="cap"><b>Before</b>HomeKit mark (homekit-tile.png)</div>
        </div>
        <div class="item">
            <div class="card"><div class="vtile vtile--ha-mark" id="newTile"></div></div>
            <div class="cap"><b>After</b>Home Assistant mark (vector)</div>
        </div>
        <div class="item">
            <div class="card"><img src="images/apps/netflix-tile.png" alt="neighbour"></div>
            <div class="cap"><b>Neighbour</b>for scale, unchanged</div>
        </div>
        <div class="item">
            <div class="card"><img src="images/apps/settings-tile.png" alt="neighbour"></div>
            <div class="cap"><b>Neighbour</b>for scale, unchanged</div>
        </div>
    </div>

    <div class="row" style="margin-top:46px">
        <div class="item big">
            <div class="card"><div class="vtile vtile--ha-mark" id="newTileBig"></div></div>
            <div class="cap"><b>After, at 2&times;</b>same markup, same rule</div>
        </div>
    </div>
</div>
<script>
    /* The same string launcher.js carries for the tile. */
    var HA_MARK = '<svg class="vtile__ha" viewBox="0 0 24 24" aria-hidden="true"><path d="M22.939 10.627 13.061.749a1.505 1.505 0 0 0-2.121 0l-9.879 9.878C.478 11.21 0 12.363 0 13.187v9c0 .826.675 1.5 1.5 1.5h9.227l-4.063-4.062a2.034 2.034 0 0 1-.664.113c-1.13 0-2.05-.92-2.05-2.05s.92-2.05 2.05-2.05 2.05.92 2.05 2.05c0 .233-.041.456-.113.665l3.163 3.163V9.928a2.05 2.05 0 0 1-1.15-1.84c0-1.13.92-2.05 2.05-2.05s2.05.92 2.05 2.05a2.05 2.05 0 0 1-1.15 1.84v8.127l3.146-3.146A2.051 2.051 0 0 1 18 12.239c1.13 0 2.05.92 2.05 2.05s-.92 2.05-2.05 2.05c-.25 0-.488-.047-.709-.13L12.9 20.602v3.088h9.6c.825 0 1.5-.675 1.5-1.5v-9c0-.825-.477-1.977-1.061-2.561z"/></svg>';
    document.getElementById('newTile').innerHTML = HA_MARK;
    document.getElementById('newTileBig').innerHTML = HA_MARK;

    /* Fit the 1920 x 1080 stage to the window, as the launcher does. */
    function fit() {
        var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        var st = document.getElementById('stage');
        st.style.transform = 'translate(' + Math.round((window.innerWidth - 1920 * s) / 2) + 'px,' +
            Math.round((window.innerHeight - 1080 * s) / 2) + 'px) scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    fit();
</script>
</body>
</html>
