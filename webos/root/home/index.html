<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Home</title>
<!-- LG's Home on a rooted TV, mounted in RAM by apl-home.sh: opens APL Launcher at once, and again at
     each press of Home (the app manager sends Home a relaunch). Transparent: nothing of it shows. If APL
     Launcher can't be opened, it says so and opens LG's Settings. -->
<style>
html, body { margin: 0; height: 100%; background: transparent; }
#msg { display: none; position: absolute; left: 0; right: 0; top: 45%; text-align: center;
       font: 500 48px/1.4 sans-serif; color: #fff; text-shadow: 0 2px 12px #000; }
</style>
</head>
<body>
<div id="msg">APL Launcher could not be opened.<br>sh /media/developer/apl-debloat/apl-home-undo.sh gives LG's Home back.</div>
<script>
(function () {
    "use strict";
    var APP = "com.knikt.apllauncher", live = [];
    function call(uri, params, done) {
        var b = new window.PalmServiceBridge();
        live.push(b);
        b.onservicecallback = function (txt) {
            var i = live.indexOf(b); if (i !== -1) live.splice(i, 1);
            var m = {}; try { m = JSON.parse(txt); } catch (e) {}
            if (done) done(m);
        };
        b.call(uri, JSON.stringify(params || {}));
    }
    function open() {
        call("luna://com.webos.applicationManager/launch", { id: APP }, function (m) {
            if (m.returnValue !== false) return;
            document.getElementById("msg").style.display = "block";
            document.body.style.background = "#000";
            call("luna://com.webos.applicationManager/launch", { id: "com.palm.app.settings" });
        });
    }
    open();
    document.addEventListener("webOSRelaunch", open);
})();
</script>
</body>
</html>
